# dsh-agents-manager bundle rows for DeepSeek Harness (dsh).
#
# Four loader rows: the core (MCP + skills + session selection + the HTTP
# API + the agents-manager:core service) plus one row per optional
# capability. Toggle each row from 插件 → dsh-agents-manager 详情 → 包含的组件;
# a disabled row disappears entirely (no tools, no settings page, no
# engine), and /state.features tells the client which UI to render.
- insert:
    - id: agents-manager
      name: "dsh-agents-manager"
      config: {}
    - id: agents-manager-subagents
      name: "dsh-agents-manager/subagents"
      config: {}
    - id: agents-manager-retry
      name: "dsh-agents-manager/retry"
      config: {}
    - id: agents-manager-processes
      name: "dsh-agents-manager/processes"
      config: {}
